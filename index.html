<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ДЕНЬ × 365</title>
  <meta name="description" content="Персональний фінансовий радник: план дня, швидкий облік витрат, безпечна сума для накопичень і одна доречна порада ввечері.">
  <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ДЕНЬ×365">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=e89a18ea72">
  <script>
    try {
      var t = localStorage.getItem('den365:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script>
    // Сторож запуску. Якщо застосунок не стартував (файл не завантажився або сталася помилка),
    // замість вічної заставки показує, що сталося, і кнопку «Оновити сторінку».
    // Після успішного запуску app.js ставить window.den365Ready = true — і сторож більше не втручається.
    (function () {
      var final = false;
      function show(title, detail, isFinal) {
        if (final || window.den365Ready) return;
        var app = document.getElementById('app');
        if (!app) return;
        final = !!isFinal;
        var box = document.createElement('div');
        box.className = 'boot boot-fail';
        box.setAttribute('role', 'alert');
        var b = document.createElement('b');
        b.textContent = title;
        var p = document.createElement('p');
        p.textContent = detail;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-primary';
        btn.textContent = 'Оновити сторінку';
        btn.onclick = function () { location.reload(); };
        box.appendChild(b);
        box.appendChild(p);
        box.appendChild(btn);
        app.innerHTML = '';
        app.appendChild(box);
      }
      addEventListener('error', function (e) {
        var el = e.target;
        if (el && el.tagName === 'SCRIPT') {
          var name = String(el.src || '').split('?')[0].split('/').pop() || 'app.js';
          show('Застосунок не завантажився',
            'Не вдалося отримати файл ' + name + '. Якщо сайт щойно оновлювався, зачекай хвилину й онови сторінку. ' +
            'Якщо не минає — цього файла немає в репозиторії: завантаж його туди з архіву.', true);
          return;
        }
        if (e.message) show('Застосунок не запустився', 'Помилка: ' + e.message, true);
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('Застосунок не запустився', 'Помилка: ' + (r && r.message ? r.message : String(r)), true);
      });
      setTimeout(function () {
        show('Завантаження затяглося', 'Перевір з’єднання з інтернетом і онови сторінку.', false);
      }, 20000);
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="boot" aria-label="Завантаження">
      <span class="boot-mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></span>
      <span>ДЕНЬ × 365</span>
    </div>
  </div>
  <noscript>
    <p style="padding:24px;font:16px/1.5 system-ui">Для роботи застосунку потрібен увімкнений JavaScript.</p>
  </noscript>
  <script defer src="./app.js?v=e89a18ea72"></script>
</body>
</html>
