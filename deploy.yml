# НЕОБОВ'ЯЗКОВО. Публікація через GitHub Actions: перед кожним оприлюдненням — тести й свіже збирання.
# Основний шлях цього файла не потребує: готові .js уже лежать у репозиторії, тож достатньо
# Settings → Pages → Source: Deploy from a branch → main, / (root).
# Щоб перейти на Actions (зручніше з комп'ютера): поклади цей файл за шляхом .github/workflows/deploy.yml
# і в Settings → Pages обери Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Тести фінансової логіки
        run: npm test

      - name: Збирання
        run: npm run build

      - name: Файли сайту в _site
        run: node build.mjs --site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
